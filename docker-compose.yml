version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: reachy-mini-cctv-backend
    ports:
      - "8501:8501"
    volumes:
      # Persistent data
      - app-data:/app/data
      # ONNX models (read-only)
      - ./core/models:/app/core/models:ro
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/cctv.db
      - FAISS_INDEX_PATH=/app/data/faces.index
      - FAISS_MAPPING_PATH=/app/data/faces_mapping.json
      - PHOTO_DIR=/app/data/photos/
      - API_HOST=0.0.0.0
      - API_PORT=8501
    restart: unless-stopped
    # Uncomment for camera access on Pi (adjust device path as needed)
    # devices:
    #   - /dev/video0:/dev/video0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  web:
    build:
      context: ./web
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8501
    container_name: reachy-mini-cctv-web
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  app-data:
    driver: local

networks:
  default:
    name: reachy-mini-cctv-network
